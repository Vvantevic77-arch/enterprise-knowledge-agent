[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Multi-tenant payment operations knowledge base and ticket execution agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "pgvector>=0.3",
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
  "numpy>=2.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28", "pytest>=8.0", "pytest-asyncio>=0.24"]
benchmark = ["pyarrow==26.0.0"]
retrieval = ["sentence-transformers>=5,<6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
